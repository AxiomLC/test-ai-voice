<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test3-Voice-AI</title>
<style>
:root{--bg:#14171a;--panel:#1c2126;--line:#2c343b;--fg:#e6e9ec;--dim:#8a949d;--accent:#4fd1c5;--warn:#f6ad55;--err:#fc8181;--ok:#68d391}
@media (prefers-color-scheme:light){:root{--bg:#f2f4f5;--panel:#fff;--line:#d5dade;--fg:#1b2024;--dim:#66717a;--accent:#0f8f84;--warn:#b7791f;--err:#c53030;--ok:#2f855a}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,Segoe UI,sans-serif;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px;padding:12px}
@media(max-width:820px){body{grid-template-columns:1fr;height:auto}}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
h2{margin:0;padding:8px 12px;font-size:13px;font-weight:600;color:var(--dim);border-bottom:1px solid var(--line)}
#left{height:calc(100vh - 24px)}#right{height:calc(100vh - 24px)}
@media(max-width:820px){#left,#right{height:80vh}}
#chat{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:85%;padding:8px 12px;border-radius:8px;white-space:pre-wrap}
.m.u{align-self:flex-end;background:var(--accent);color:#06201d}.m.a{align-self:flex-start;border:1px solid var(--line)}.m.i{opacity:.6;font-style:italic}
#controls{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px}
#row{display:flex;align-items:center;gap:14px}
#mic{width:72px;height:72px;flex:none;border-radius:50%;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer;color:var(--dim);transition:border-color .15s,color .15s}
#mic svg{width:32px;height:32px}
body[data-s=listening] #mic{border-color:var(--ok);color:var(--ok);animation:p 1.2s infinite}
body[data-s=thinking] #mic{border-color:var(--warn);color:var(--warn)}
body[data-s=speaking] #mic{border-color:var(--accent);color:var(--accent)}
@keyframes p{50%{box-shadow:0 0 0 10px transparent;box-shadow:0 0 0 10px color-mix(in srgb,var(--ok) 25%,transparent)}}
@media(prefers-reduced-motion:reduce){#mic{animation:none!important}}
#status{font-weight:600}#interim{color:var(--dim);min-height:1.4em}
button,select,input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button:focus-visible,#mic:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{border-color:var(--accent);color:var(--accent)}
.seg{display:flex}.seg button{border-radius:0;margin-left:-1px}.seg button:first-child{border-radius:6px 0 0 6px;margin:0}.seg button:last-child{border-radius:0 6px 6px 0}
#typed{display:none;gap:8px}#typed input{flex:1}
#specs{padding:8px 12px;font:12px/1.5 ui-monospace,Consolas,monospace;color:var(--dim);border-bottom:1px solid var(--line);white-space:pre-wrap}
#log{flex:1;overflow:auto;padding:8px 12px;font:12px/1.5 ui-monospace,Consolas,monospace}
#log div.warn{color:var(--warn)}#log div.err{color:var(--err)}#log div.ok{color:var(--ok)}
</style></head>
<body data-s="idle">
<section id="left">
  <h2>Chat</h2>
  <div id="chat"></div>
  <div id="controls">
    <div id="row">
      <button id="mic" aria-label="Talk" title="Talk / stop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/></svg>
      </button>
      <div style="flex:1;min-width:0"><div id="status">Idle</div><div id="interim"></div></div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
      <div class="seg" id="engines" role="group" aria-label="TTS engine">
        <button data-e="pocket">Pocket</button><button data-e="kokoro" class="on">Kokoro</button><button data-e="piper">Piper</button>
      </div>
      <button id="rearm" class="on" title="After the reply starts playing, re-open the mic (barge-in)">Re-arm: On</button>
      <button id="kbd">Keyboard</button>
      <button id="stop" title="Stop speech and mic">Stop</button>
      <button id="clear">Clear chat</button>
    </div>
    <div id="typed"><input id="txt" placeholder="Type a message" autocomplete="off"><button id="send">Send</button></div>
  </div>
</section>
<section id="right">
  <h2>Specs &amp; log</h2>
  <div id="specs">loading…</div>
  <div id="log"></div>
</section>
<script>
const $=s=>document.querySelector(s);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const SILENCE_MS=2000, BARGE_GRACE_MS=500, BARGE_MIN_CHARS=4;
let engine='kokoro', rearm=true, armed=false, state='idle';
let rec=null, recRunning=false, buf='', interim='', silenceT=null;
let history=[], gen=0, ctx=null, queueT=0, sources=[], speakingStart=0, firstAudioLogged=false;

// ---------- log / ui ----------
function log(msg,cls=''){const d=document.createElement('div');d.className=cls;d.textContent=`${new Date().toLocaleTimeString()}  ${msg}`;$('#log').append(d);$('#log').scrollTop=1e9;
  fetch('/api/ui-log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cls,msg})}).catch(()=>{})}
function setState(s,label){state=s;document.body.dataset.s=s;$('#status').textContent=label||s[0].toUpperCase()+s.slice(1)}
function bubble(role,text,cls=''){const d=document.createElement('div');d.className=`m ${role} ${cls}`;d.textContent=text;$('#chat').append(d);$('#chat').scrollTop=1e9;return d}
window.addEventListener('error',e=>log('JS error: '+e.message,'err'));
window.addEventListener('unhandledrejection',e=>log('Unhandled: '+(e.reason?.message||e.reason),'err'));

fetch('/api/config').then(r=>r.json()).then(c=>{
  $('#specs').textContent=`Host   ${c.host}\nGPU    none (Intel Iris Xe, CPU inference)\nLLM    ${c.model}  key:${c.keySet?'set':'MISSING'}\nKokoro ${c.engines.kokoro}\nPocket ${c.engines.pocket}\nPiper  ${c.engines.piper}\nSTT    ${SR?'Web Speech (Chrome)':'NOT SUPPORTED — use Chrome'}\nSilence timeout ${SILENCE_MS} ms`;
  if(!c.keySet)log('DEEPINFRA_API_KEY missing in .env','err');
}).catch(e=>log('config failed: '+e.message,'err'));
if(!SR)log('Web Speech API unavailable. Use Chrome (typing still works).','err');

// ---------- audio playback (sentence queue, gapless, interruptible) ----------
function audioCtx(){if(!ctx)ctx=new AudioContext();if(ctx.state==='suspended')ctx.resume();return ctx}
function stopAudio(reason){
  gen++; sources.forEach(s=>{try{s.onended=null;s.stop()}catch{}}); sources=[]; queueT=0;
  if(reason)log('Playback cut: '+reason,'warn');
}
function splitSentences(t){
  const parts=t.replace(/\s+/g,' ').match(/[^.!?…]+[.!?…]+["')\]]*\s*|[^.!?…]+$/g)||[t];
  const out=[];for(const p of parts){const s=p.trim();if(!s)continue;
    if(out.length&&out[out.length-1].length<25)out[out.length-1]+=' '+s;else out.push(s)}return out;
}
async function ttsFetch(text,e){
  const t0=performance.now();
  const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({engine:e,text})});
  if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||('TTS HTTP '+r.status));
  const ab=await r.arrayBuffer(); const ms=Math.round(performance.now()-t0);
  const audio=await audioCtx().decodeAudioData(ab);
  log(`TTS[${e}] "${text.slice(0,30)}…" ${ms} ms → ${audio.duration.toFixed(2)}s audio (RTF ${(ms/1000/audio.duration).toFixed(2)})`, ms/1000>audio.duration?'warn':'');
  return audio;
}
function scheduleAudio(audio){
  const c=audioCtx(),src=c.createBufferSource();src.buffer=audio;src.connect(c.destination);
  const start=Math.max(c.currentTime+0.03,queueT);src.start(start);queueT=start+audio.duration;sources.push(src);
  if(!firstAudioLogged){firstAudioLogged=true;
    const wait=Math.max(0,(start-c.currentTime)*1000);
    setTimeout(()=>{ if(gen!==scheduleAudio.gen)return; speakingStart=performance.now(); setState('speaking','Speaking'); onFirstAudio() },wait);
  }
  return new Promise(r=>{src.onended=()=>{sources=sources.filter(s=>s!==src);r()}});
}
scheduleAudio.gen=null;
function onFirstAudio(){ if(rearm){log('Mic re-armed (barge-in active)'); armed=true; startRec()} }
function onPlaybackDone(){ log('Playback done'); setState(armed&&rearm?'listening':'idle',armed&&rearm?'Listening':'Idle') }

// ---------- speech recognition ----------
function startRec(){
  if(!SR){return}
  if(recRunning)return;
  rec=new SR(); rec.lang='en-US'; rec.continuous=true; rec.interimResults=true;
  rec.onstart=()=>{recRunning=true; if(state!=='speaking')setState('listening','Listening')};
  rec.onerror=e=>{ if(e.error==='no-speech'||e.error==='aborted')return; log('STT error: '+e.error,'err');
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){armed=false;setState('idle','Mic blocked')} };
  rec.onend=()=>{recRunning=false; if(armed&&state!=='thinking')setTimeout(startRec,150); else if(!armed&&state==='listening')setState('idle')};
  rec.onresult=ev=>{
    let fin='',int='';
    for(let i=ev.resultIndex;i<ev.results.length;i++){const t=ev.results[i][0].transcript; ev.results[i].isFinal?fin+=t:int+=t}
    if(fin)buf+=(buf?' ':'')+fin.trim(); interim=int;
    const heard=(buf+' '+interim).trim(); $('#interim').textContent=heard;
    if(!heard)return;
    // barge-in
    if(state==='speaking'){
      if(performance.now()-speakingStart<BARGE_GRACE_MS||heard.length<BARGE_MIN_CHARS)return;
      stopAudio('barge-in'); setState('listening','Listening');
    }
    clearTimeout(silenceT); silenceT=setTimeout(commit,SILENCE_MS);
  };
  try{rec.start()}catch(e){log('rec.start: '+e.message,'warn')}
}
function stopRec(){armed=false;clearTimeout(silenceT);try{rec&&rec.abort()}catch{};recRunning=false}
function commit(){
  const text=(buf+' '+interim).trim(); buf='';interim='';$('#interim').textContent='';
  if(!text)return;
  log(`Silence ${SILENCE_MS} ms → sending`);
  try{rec&&rec.abort()}catch{}; recRunning=false;   // mic closed while thinking; re-armed on first audio
  send(text);
}

// ---------- chat (streaming: SSE → sentences → per-sentence TTS → gapless playback) ----------
async function send(text){
  stopAudio(); bubble('u',text); history.push({role:'user',content:text});
  setState('thinking','Thinking…'); const tSend=performance.now();
  const my=gen; firstAudioLogged=false; scheduleAudio.gen=my;
  let wait=bubble('a','…','i'); let live=null; full='';
  const slots=[],resolved=[]; let nextPlay=0,active=0,ended=false,pending=[];

  function drainPending(){
    while(active<2&&pending.length){
      const [i,s]=pending.shift(); active++;
      ttsFetch(s,engine).then(a=>{ if(gen!==my)return; slots[i]=a; resolved[i]=true; active--; tryPlay() })
        .catch(e=>{ if(gen!==my)return; log('TTS error: '+e.message,'err'); resolved[i]=true; active--; tryPlay() });
    }
  }
  async function tryPlay(){
    while(nextPlay<slots.length){
      if(!resolved[nextPlay])return;                 // in-order playback
      const a=slots[nextPlay++];
      if(a){ await scheduleAudio(a); if(gen!==my)return;
        if(nextPlay===1)log(`TTFA (send → first audio): ${Math.round(performance.now()-tSend)} ms`,'ok'); }
    }
    if(ended&&active===0&&nextPlay>=slots.length)onPlaybackDone();
  }
  function pushSentence(s){ if(!s.trim())return; const i=slots.length;slots.push(null);pending.push([i,s]);drainPending() }

  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:history.slice(-12),stream:true})});
    if((r.headers.get('content-type')||'').includes('application/json')){const j=await r.json();throw new Error(j.error||('HTTP '+r.status))}
    const reader=r.body.getReader(),dec=new TextDecoder();
    let acc='',consumed=0,usage=null,firstTok=0,nDelta=0;
    while(true){
      const {done,value}=await reader.read(); if(done)break;
      acc+=dec.decode(value,{stream:true}); let ix;
      while((ix=acc.indexOf('\n\n'))>=0){
        const chunk=acc.slice(0,ix); acc=acc.slice(ix+2);
        for(const line of chunk.split('\n')){
          if(!line.startsWith('data:'))continue;
          const payload=line.slice(5).trim(); if(payload==='[DONE]')continue;
          let j; try{j=JSON.parse(payload)}catch{continue}
          if(j.error&&j.message)throw new Error(j.message);
          if(j.error)throw new Error(JSON.stringify(j.error).slice(0,200));
          const d=j.choices?.[0]?.delta?.content||'';
          if(d){ if(!firstTok){firstTok=performance.now()-tSend; wait&&wait.remove&&wait.remove(); wait=null; live=bubble('a',''); }
            full+=d; if(live)live.textContent=full; nDelta++; }
          if(j.usage)usage=j.usage;
        }
      }
      // emit any completed sentences (terminator followed by whitespace = safe)
      let seg=full.slice(consumed),m;
      while((m=seg.match(/^[\s\S]*?[.!?…]+["')\]]*(?=\s)/))){
        consumed+=m[0].length; pushSentence(m[0].trim());
        seg=full.slice(consumed);
      }
    }
    ended=true;
    const rest=full.slice(consumed).trim(); if(rest)pushSentence(rest);
    log(`LLM stream: first token ${Math.round(firstTok)} ms, ${nDelta} deltas, total ${Math.round(performance.now()-tSend)} ms${usage?`, ${usage.completion_tokens} tok`:''}`,'ok');
    history.push({role:'assistant',content:full});
    tryPlay();
  }catch(e){
    wait&&wait.remove&&wait.remove(); live&&live.remove&&live.remove();
    log('Chat error: '+e.message,'err'); bubble('a','Error: '+e.message,'i');
    if(full)history.push({role:'assistant',content:full});
    setState(armed?'listening':'idle'); if(armed&&rearm)startRec();
  }
}

// ---------- controls ----------
$('#mic').onclick=()=>{
  audioCtx(); // unlock audio on user gesture
  if(armed||state==='speaking'||state==='listening'){stopRec();stopAudio('user stop');setState('idle');log('Stopped');return}
  armed=true; buf='';interim=''; log('Talk pressed'); startRec();
};
$('#stop').onclick=()=>{stopRec();stopAudio('stop button');setState('idle');log('Stopped')};
$('#rearm').onclick=e=>{rearm=!rearm;e.target.classList.toggle('on',rearm);e.target.textContent='Re-arm: '+(rearm?'On':'Off');log('Re-arm '+(rearm?'ON':'OFF'),'warn')};
$('#engines').onclick=e=>{const b=e.target.closest('button');if(!b)return;engine=b.dataset.e;
  document.querySelectorAll('#engines button').forEach(x=>x.classList.toggle('on',x===b));log('TTS engine → '+engine,'warn')};
$('#kbd').onclick=e=>{const on=$('#typed').style.display!=='flex';$('#typed').style.display=on?'flex':'none';e.target.classList.toggle('on',on);if(on)$('#txt').focus()};
const sendTyped=()=>{const t=$('#txt').value.trim();if(!t)return;$('#txt').value='';audioCtx();send(t)};
$('#send').onclick=sendTyped; $('#txt').onkeydown=e=>{if(e.key==='Enter')sendTyped()};
$('#clear').onclick=()=>{$('#chat').innerHTML='';history=[];log('Chat cleared')};
</script></body></html>
